name: Avacta Sentinel OpenBB probe
on:
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real OpenBB SDK
        run: python -m pip install --disable-pip-version-check "openbb==4.7.2" "openbb-yfinance==1.6.3" pandas
      - name: Build OpenBB v4 router interface
        run: openbb-build
      - name: Validate probe
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Run real provider probe
        run: python live_probe.py
      - name: Collect FCA, issuer and clinical trial evidence
        if: always()
        run: python research_pipeline.py
      - name: Assemble five-factor evidence scorecard
        if: always()
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scorecard_pipeline.py
      - name: Prepare read-only Pages dashboard
        if: success()
        run: |
          mkdir -p public
          cp artifacts/sentinel_dashboard.html public/index.html
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
      - name: Upload GitHub Pages artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy read-only dashboard to GitHub Pages
        if: success()
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Preserve diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avct-openbb-probe
          path: |
            artifacts/openbb_probe.json
            artifacts/public_research.json
            artifacts/sentinel_scorecard.json
            artifacts/forward_levels.json
            artifacts/independent_price_verification.json
            artifacts/isa_positioning_report.json
            artifacts/isa_positioning_report.md
            artifacts/sentinel_dashboard.html
            artifacts/downside_retrospective.json
            artifacts/forward_signal_audit.json
            artifacts/signal_baseline.json
            artifacts/tradermonty_technical_review.json
            artifacts/tradermonty_weekly.json
            artifacts/tradermonty_catalysts.json
            artifacts/tradermonty_pretrade.json
            artifacts/risk_event.json
          if-no-files-found: warn
